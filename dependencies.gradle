// Keep the development pack pinned; release profiles compile against each pack's actual APIs.
def sfmTarget = providers.gradleProperty("sfmTarget").getOrElse("daily803")
def sfmTargets = [
    daily803: [pack: "daily-2026-10-27+803", suffix: "gtnh-daily-803", mui: "2.3.93-1.7.10", lib: "0.11.54", nei: "2.8.169-GTNH"],
    rc2: [pack: "2.9.0-RC-2", suffix: "gtnh-2.9.0-rc2", mui: "2.3.92-1.7.10", lib: "0.11.52", nei: "2.8.155-GTNH"],
    nightly: [pack: "daily-2026-10-30+807", suffix: "gtnh-nightly-807", mui: "2.3.94-1.7.10", lib: "0.11.54", nei: "2.8.171-GTNH"]
]
def sfmApis = sfmTargets[sfmTarget]
if (sfmApis == null) {
    throw new GradleException("Unknown sfmTarget '${sfmTarget}'; choose daily803, rc2 or nightly.")
}
ext.sfmTargetPack = sfmApis.pack
ext.sfmTargetSuffix = sfmApis.suffix

dependencies {
    shadowImplementation("org.antlr:antlr4-runtime:4.13.2")

    // Public UI builders expose MUI2 types. Keep MUI2 as an ordinary mod dependency.
    api("com.github.GTNewHorizons:ModularUI2:${sfmApis.mui}:dev")
    // Match the selected pack rather than MUI2's older transitive defaults.
    implementation("com.github.GTNewHorizons:GTNHLib:${sfmApis.lib}:dev")
    // A plain test JVM does not run Forge's optional-interface stripping.
    testRuntimeOnly("com.github.GTNewHorizons:ModularUI:1.3.4:dev") { transitive = false }
    testRuntimeOnly("com.github.GTNewHorizons:lwjgl3ify:3.0.40:api") { transitive = false }
    testRuntimeOnly("curse.maven:neverenoughanimation-1062347:7664003-sources-7663978") { transitive = false }
    // GTNHLib supplies this in-game; real MUI2 panel construction also needs it in plain JUnit.
    testRuntimeOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }

    compileOnly("com.github.GTNewHorizons:Steve-s-Factory-Manager:1.3.9-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:StevesAddons:0.15.2:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:${sfmApis.nei}:dev") { transitive = false }

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
