name: Build SuperFactoryManager

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rc2, nightly]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          SFM_TARGET: ${{ matrix.target }}
          SFM_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=(build "-PsfmTarget=$SFM_TARGET")
          if [[ -n "$SFM_RELEASE_TAG" ]]; then
            args+=("-PsfmVersion=${SFM_RELEASE_TAG#v}")
          fi
          ./gradlew "${args[@]}"

      - name: Upload Mod Jars
        uses: actions/upload-artifact@v4
        with:
          name: SuperFactoryManager-${{ matrix.target }}
          path: |
            build/libs/superfactorymanager-*.jar
            !build/libs/*-dev-preshadow.jar
            !build/libs/*-predowngrade.jar
            !build/libs/*-dirty*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar

      # Publishing is explicit: upload verified target JARs and checksums together.
      # CI must not overwrite release assets after their checksum manifest is published.
